apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "team-quiz.fullname" . }}
  labels:
    {{- include "team-quiz.labels" . | nindent 4 }}
data:
  WIN_SCORE: {{ .Values.app.winScore | quote }}
  TIMER_SECONDS: {{ .Values.app.timerSeconds | quote }}
  MAX_PLAYERS: {{ .Values.app.maxPlayers | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  # Behind an ingress, X-Forwarded-For is trustworthy — the per-IP login throttle
  # needs it to see the real client rather than the load balancer.
  TRUST_PROXY: "true"
  # HTTPS-forcing headers (HSTS + CSP upgrade-insecure-requests). On by default
  # for the ALB/TLS case. Set app.enableHttps=false for plain-HTTP testing.
  ENABLE_HTTPS: {{ .Values.app.enableHttps | default true | quote }}
  DATA_FILE: {{ printf "%s/state.json" .Values.persistence.mountPath | quote }}
  # Admin accounts MUST be persisted, or every pod restart wipes them and nobody
  # can host a game. On an ephemeral filesystem this means either the PVC below
  # or (better, and required for >1 replica) Redis.
  ADMINS_FILE: {{ printf "%s/admins.json" .Values.persistence.mountPath | quote }}
  {{- if .Values.redis.url }}
  REDIS_URL: {{ .Values.redis.url | quote }}
  {{- end }}
